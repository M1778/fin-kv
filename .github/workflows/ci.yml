name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install the C toolchain the smoke test needs
        run: |
          # tests/smoke.py builds a small fault-injecting .so with $CC. That is the only
          # thing this workflow needs from the host now that finc is an artifact.
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

      # The released glibc artifact needs libLLVM.so.22; without it the loader aborts before
      # main and the failure reads as a broken compiler. This is a no-op on a platform whose
      # artifact needs nothing, and needs no `shell:` override because this workflow's steps
      # already run under bash.
      - name: Install the LLVM runtime the artifact needs
        run: python .github/scripts/install_finc_runtime.py

      - name: Install the pinned finc
        run: python .github/scripts/install_finc.py --dest "$RUNNER_TEMP/finc"

      - name: Put finc on PATH
        run: |
          echo "$RUNNER_TEMP/finc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/finc/bin/finc" --version

      - name: Frontend check
        run: |
          finc src/main.fin

      - name: Build executable
        run: |
          finc src/main.fin -o fin-kv

      - name: Smoke test
        run: |
          python3 tests/smoke.py

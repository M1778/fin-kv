# fin-kv CI.
#
# `finc` comes from the published release, not a source build: this repository
# needs a compiler, not a compiler development environment. The version is
# pinned in FINC_VERSION, and .github/scripts/install_finc.py verifies the
# archive's SHA-256 against the release index before using it.
#
# The platform matrix is honest rather than uniform. fin-kv's store needs Linux
# `uname`, `flock`, and per-architecture O_DIRECTORY/O_NOFOLLOW bits, so
# `src/main.fin` compiles to a named refusal off Linux. Every lane therefore
# builds and *executes* a real program; the macOS and Windows lanes require the
# refusal, rather than reporting a pass for work they did not do.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # One script per step rather than one per operating system.
    shell: bash

jobs:
  linux:
    name: linux-${{ matrix.arch }}-${{ matrix.opt }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            opt: O0
          - runner: ubuntu-24.04
            arch: x86_64
            opt: O2
          - runner: ubuntu-24.04-arm
            arch: aarch64
            opt: O0
    steps:
      - uses: actions/checkout@v4

      - name: Locate Python
        run: |
          # Ubuntu 24.04 has no `python` alias and Windows has no `python3`;
          # resolve once so every later step names one variable.
          if command -v python3 > /dev/null; then
            echo "PYTHON=python3" >> "$GITHUB_ENV"
          else
            echo "PYTHON=python"
          fi

      - name: Install finc
        run: $PYTHON .github/scripts/install_finc.py

      - name: Prove the compiler builds and runs a program
        # `finc --version` is not proof that linking works: a published artifact
        # can answer it and still fail the first `-o` build, which is exactly
        # what happened on the 1.0.0 gnu artifacts. Compiling a real program
        # here turns that into one clear failure instead of a confusing one
        # inside the suite.
        run: |
          finc --version
          finc --version | grep -q 'contract 3'
          printf 'fun main() <int> { printf("selfcheck\\n"); return 0; }\n' > "$RUNNER_TEMP/selfcheck.fin"
          finc "$RUNNER_TEMP/selfcheck.fin" -o "$RUNNER_TEMP/selfcheck"
          "$RUNNER_TEMP/selfcheck" | grep -qx selfcheck

      - name: Build
        # FIN_LDFLAGS replaces finc's default library set. Generated objects
        # reference no LLVM symbol (checked with `nm -u`), but finc's default
        # link line asks for -lLLVM-22 regardless, so an image without the LLVM
        # development package cannot link a program that does not use LLVM.
        # Dropping it keeps the link honest; the store needs only libm for
        # printf's float helpers.
        env:
          FIN_LDFLAGS: "-lm"
        run: |
          mkdir -p out
          finc src/main.fin -${{ matrix.opt }} -o out/fin-kv

      - name: Test
        run: $PYTHON tests/run.py --bin out/fin-kv

  # The store cannot serve off Linux. These lanes build the same source and
  # require a named message plus exit 1, so a build that stopped compiling, or
  # a refusal quietly turned into a zero exit, fails here.
  refusal:
    name: ${{ matrix.name }} (store unsupported; named refusal)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Locate Python
        run: |
          if command -v python3 > /dev/null; then
            echo "PYTHON=python3" >> "$GITHUB_ENV"
          else
            echo "PYTHON=python"
          fi

      - name: Install the compiler's macOS runtime
        if: runner.os == 'macOS'
        # The published macOS artifact links an absolute Homebrew LLVM path.
        # That keg is the artifact's dependency, not this repository's, but a
        # lane that cannot run its compiler tests nothing.
        run: brew install llvm@22

      - name: Install finc
        run: $PYTHON .github/scripts/install_finc.py

      - name: Prove the compiler builds and runs a program
        run: |
          finc --version
          finc --version | grep -q 'contract 3'
          printf 'fun main() <int> { printf("selfcheck\\n"); return 0; }\n' > "$RUNNER_TEMP/selfcheck.fin"
          finc "$RUNNER_TEMP/selfcheck.fin" -o "$RUNNER_TEMP/selfcheck"
          "$RUNNER_TEMP/selfcheck" | grep -qx selfcheck

      - name: Build the platform refusal
        run: |
          mkdir -p out
          finc src/main.fin -o out/fin-kv

      - name: Assert the refusal is named and nonzero
        run: $PYTHON tests/platform.py --bin out/fin-kv --expect refusal

      - name: Assert the full runner agrees with the host
        run: $PYTHON tests/run.py --bin out/fin-kv
